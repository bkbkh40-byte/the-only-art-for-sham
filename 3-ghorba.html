<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>غربة — ٣</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c10;
    --text:#e7e2d6;
    --text-dim:#7c8591;
    --accent:#c77b3e;
    --accent-soft:#c77b3e55;
    --line:#232830;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{ background:var(--bg); color:var(--text); font-family:'Cairo', sans-serif; overflow-x:hidden; position:relative; }
  body::before{
    content:""; position:fixed; inset:0; z-index:2; pointer-events:none; opacity:0.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  body::after{
    content:""; position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
  }
  #wander-path{ position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  #starfield{ position:fixed; inset:0; z-index:0; pointer-events:none; }
  .star{ position:absolute; width:2px; height:2px; border-radius:50%; background:var(--text-dim); opacity:0.5; animation:twinkle 6s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{opacity:0.15;} 50%{opacity:0.6;} }
  main{ position:relative; z-index:3; }

  .epigraph{ min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:2rem; }
  .epigraph .title{
    font-family:'Cairo', sans-serif; font-weight:900;
    font-size:clamp(2.6rem, 9vw, 5.5rem); color:var(--accent);
    text-shadow:0 0 40px var(--accent-soft);
    opacity:0; animation:fadeUp 2s ease forwards 0.3s;
  }
  .epigraph .part{
    margin-top:0.8rem; font-family:'Space Grotesk', sans-serif; font-size:0.85rem;
    color:var(--text-dim); letter-spacing:0.3em; direction:ltr;
    opacity:0; animation:fadeUp 2s ease forwards 0.7s;
  }
  .epigraph .hint{
    margin-top:3rem; font-size:0.85rem; color:var(--text-dim); letter-spacing:0.1em;
    opacity:0; animation:fadeUp 2s ease forwards 1.2s, bob 3s ease-in-out infinite 3.2s;
  }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(20px);} to{opacity:1; transform:translateY(0);} }
  @keyframes bob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(6px);} }

  .line-section{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:4rem 1.5rem; text-align:center; position:relative; }
  .line-section .num{ position:absolute; top:2.5rem; font-family:'Space Grotesk', sans-serif; font-size:0.85rem; color:var(--text-dim); letter-spacing:0.1em; direction:ltr; opacity:0.5; }
  .line{ font-size:clamp(2rem, 5.8vw, 3.8rem); line-height:1.7; max-width:16ch; font-weight:700; opacity:0; transform:translateY(30px); transition:opacity 1.3s ease, transform 1.3s ease; }
  .line.visible{ opacity:1; transform:translateY(0); }
  .line-section.dim .line{ color:var(--text-dim); font-weight:600; }
  .line-section:nth-of-type(odd)::before{
    content:""; position:absolute; right:50%; bottom:1.5rem; transform:translateX(50%);
    width:1px; height:3rem; background:linear-gradient(to bottom, transparent, var(--line));
  }

  .nav-forward{
    min-height:60vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:3rem; gap:1.3rem;
  }
  .mark{ width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 20px 4px var(--accent-soft); }
  .nav-forward span{
    color:var(--text-dim); font-family:'Cairo', sans-serif;
    font-weight:600; font-size:clamp(1.3rem, 3.5vw, 1.8rem); letter-spacing:0.01em;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
    .line{opacity:1; transform:none;}
  }
</style>
</head>
<body>

<svg id="wander-path" viewBox="0 0 100 100" preserveAspectRatio="none">
  <path id="ghost-path" d="M50,0 C10,14 88,26 24,38 C-15,48 96,58 40,70 C6,78 78,86 50,94 C36,98 64,99 50,100"
    stroke="#2a2f38" stroke-width="0.12" fill="none" stroke-dasharray="0.4 1.6" opacity="0.55"/>
  <circle id="wander-dot" r="0.55" fill="#c77b3e">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>

<div id="starfield"></div>

<main>
  <section class="epigraph">
    <div class="title">غربة</div>
    <div class="part">PART III / III</div>
    <div class="hint">— انزل ببطء —</div>
  </section>

  <section class="line-section">
    <span class="num">vi.</span>
    <p class="line">لو هناك مش هنتقابل</p>
  </section>

  <section class="line-section dim">
    <span class="num">vii.</span>
    <p class="line">يبقا حدفت كتير وما صابتش</p>
  </section>

  <section class="nav-forward">
    <div class="mark"></div>
    <span>لسه مخلصتش</span>
  </section>
</main>

<script>
  const lines = document.querySelectorAll('.line');
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('visible'); } });
  }, {threshold:0.4});
  lines.forEach(l=>io.observe(l));

  const field = document.getElementById('starfield');
  for(let i=0;i<70;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100 + 'vw';
    s.style.top = Math.random()*100 + '%';
    s.style.transform = `scale(${0.5 + Math.random()*1.5})`;
    s.style.animationDelay = (Math.random()*6) + 's';
    field.appendChild(s);
  }

  const path = document.getElementById('ghost-path');
  const dot = document.getElementById('wander-dot');
  const pathLength = path.getTotalLength();
  function updateDot(){
    const scrollTop = window.scrollY;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    const progress = docHeight > 0 ? Math.min(Math.max(scrollTop/docHeight, 0), 1) : 0;
    const point = path.getPointAtLength(progress * pathLength);
    dot.setAttribute('cx', point.x);
    dot.setAttribute('cy', point.y);
  }
  window.addEventListener('scroll', updateDot, {passive:true});
  window.addEventListener('resize', updateDot);
  updateDot();
</script>

</body>
</html>
